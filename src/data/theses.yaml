      rozvoj terénních, odlehčovacích a dalších služeb, které umožní seniorům co nejdéle
      důstojně žít ve vlastním prostředí a současně pomohou jejich rodinám. Město
      má podporovat také dostupné bezbariérové bydlení a další praktické služby usnadňující
      seniorům každodenní život. Konkrétní nástroje, jako je Senior Taxi, jsme připraveni
      posoudit podle jejich skutečné potřebnosti a efektivity.
