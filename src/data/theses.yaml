  thesisContext: |
    Chomoutov byl při povodni v roce 2024 zasažen a město proto hledá řešení jeho protipovodňové ochrany. Zpracované studie se liší mírou ochrany, náklady i náročností přípravy (viz odkazovaný materiál). Investiční náklady na opatření proti 10–20leté vodě jsou odhadovány na 77 milionů, zatímco opatření proti stoleté vodě jsou dvě: za 0,4 nebo 1,3 miliardy. Aby fungovala protipovodňová ochrana města Olomouce proti stoleté povodni, je potřeba dokončit všechny části kolem řeky Moravy. Kromě ochrany Chomoutova je třeba dokončit realizaci etapy Černovír – most na ul. Komenského. https://olomouc.eu/administrace/repository/gallery/articles/30_/30382/ppo-chomoutov-mmol-odb-ochrany.pdf
  category: Klima a energetika
