  thesis: |
    Souhlasíte s tím, aby v odůvodněných případech byla omezena parkovací místa ve prospěch zeleně, stromů a opatření pro zadržování dešťové vody, jako základní principy Modrozelené infrastruktury pro boj s negativními dopady klimatických změn ve městě?
  thesisContext: |
    Modrozelená infrastruktura znamená využívat zeleň a přírodní prvky také k ochlazování města a zadržování dešťové vody. Patří sem například stromy, zelené plochy, propustné povrchy nebo opatření, která umožňují dešťové vodě zůstat tam, kde spadne. V praxi může někdy znamenat i jinou podobu veřejného prostoru nebo méně prostoru pro auta. 
    Podrobné informace naleznete v dokumentu Hospodaření se srážkovými vodami – cesta k modrozelené infrastruktuře. https://www.olomouc.eu/administrace/repository/gallery/articles/23_/23422/hdv_cesta_k_mzi.cs.pdf
    Na webových stránkách města se dozvíte: “Dokument je určen odborné i laické veřejnosti a měl by se stát základním městským předpisem pro boj s negativními dopady klimatických změn na území města Olomouce. https://www.olomouc.eu/o-meste/uzemni-planovani/koncepce-metodiky/modrozelena-infrastruktura
