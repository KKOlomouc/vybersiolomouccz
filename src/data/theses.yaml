  thesis: Souhlasíte s komplexním rozvojem péče o seniory, který zahrnuje rozšiřování i výstavbu domovů pro seniory (soběstačné i nesoběstačné) a zároveň posílení dostupnosti navazujících sociálních služeb (pečovatelská služba, mobilní hospic apod.) a jiné formy podpory (např. Senior Taxi)?
  thesisContext: |
    V Olomouci nejsou dostupné například následující možnosti podpory starších osob:
    Starší osoby v současné době v Olomouci mohou čelit například:
    Nedostatek míst v domovech pro seniory a lidi s demencí:
    V Olomouci kriticky chybí lůžka v domovech se zvláštním režimem, kvůli čemuž rodiny marně hledají péči pro nesoběstačné příbuzné. Město může na vlastních pozemcích, ve spolupráci se Státním fondem podpory investic (SFPI) a krajem, vybudovat nové kapacity. To zajistí odbornou péči a odlehčí rodinám, které dnes pečují na hranici svých sil.
    Chybějící odlehčovací služby pro pečující rodiny:
    Rodinám pečujícím doma scházejí služby pro odpočinek a prevenci vyhoření. Město může rozšířit terénní i pobytové odlehčovací služby účelovými dotacemi pro organizace, jako je Charita či Maltézská pomoc. Pečujícím to poskytne nezbytný čas na regeneraci a udržení vlastního zdraví.
    Absence dotované dopravy pro starší lidi (Senior Taxi):
    Seniorům a lidem se sníženou mobilitou chybí bezpečná doprava k lékařům či na úřady. Město může prostřednictvím Dopravního podniku zavést plošně dotovanou službu Senior Taxi za symbolické jízdné. Seniorům to umožní zachovat si nezávislost a zůstat aktivní součástí společnosti.
    Chybějící krizová podpora a poradenství pro osamělé seniory:
    Osaměle žijícím seniorům chybí okamžitá pomoc a jejich rodinám přehledné místo pro radu. Radnice může zavést bezplatné SOS náramky napojené na dispečink Městské policie a na Odboru sociálních věcí zřídit kontaktní centrum pro psychologické a právní poradenství. To zvýší bezpečí seniorů a uleví vystresovaným rodinám.
    Chybějící dlouhodobá koncepční garance:
    Sociální péči často chybí stabilní směřování. Zvolení zástupci mohou tyto kroky garantovat jejich zanesením do priorit Střednědobého plánu rozvoje sociálních služeb a financovat je kombinací městského rozpočtu, dotací MPSV a fondů EU. Olomouc se tak promění v město, které se o své nejstarší obyvatele stará komplexně a s respektem.
  category: Bydlení a sociální politika
