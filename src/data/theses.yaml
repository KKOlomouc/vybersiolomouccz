  thesis: Souhlasíte s výstavbou nové multifunkční haly v Olomouci na Velkomoravské ul. i za nyní sjednaných podmínek?
  thesisContext: |
    Celkové náklady na stavbu haly se odhadují na 2,574 miliardy Kč. Za současných podmínek se město zavázalo přispívat částkou 35,1 milionu Kč ročně na dalších 30 let (celkem cca 1 miliarda Kč). Olomoucký kraj schválil podporu ve výši 16 milionů Kč ročně. Obě tyto částky se budou každoročně zvyšovat o inflaci. Celkově by tak samosprávy měly za 30 let vyplatit na dotacích přibližně 2,1 miliardy korun. Soukromý investor (Redstone) zabezpečí financování projektu pomocí vlastního kapitálu, bankovních úvěrů a vloží do projektu pozemky v hodnotě 265 milionů korun. Investor bude halu také stavět, vlastnit a po celou dobu provozovat a udržovat na vlastní náklady. Kritika poukazuje na to, že město (i kraj) po 30 letech splácení nebudou vlastnit vůbec nic (hala zůstane soukromá). Navíc třicetiletý finanční závazek s inflací představuje obrovské riziko pro budoucí rozpočty města.    
