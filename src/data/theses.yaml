- id: question-16
  index: 16
  thesis: Souhlasíte se systematickým rozšiřováním bytového fondu (například výkup, výstavba nemovitostí nebo zvýhodněné odkoupení bytů z developerských projektů) za účelem poskytování cenově dostupného nájemního, sociálního i bezbariérového bydlení?
  thesisContext: |
    Rozšíření městského bytového fondu zajistí mladým lidem a rodinám dosažitelné startovací nájmy bez nutnosti platit přemrštěné komerční ceny na soukromém trhu a pomůže udržet v Olomouci klíčové profese, jako jsou zdravotníci, učitelé či řidiči MHD, kterým město nabídne stabilní a cenově předvídatelné zázemí. Seniorům a lidem se zdravotním znevýhodněním poskytne bezpečné a bezbariérové byty s přiměřeným nájmem, který je neuvrhne do chudoby, přičemž větší nabídka obecních bytů navíc vytvoří zdravou konkurenci na realitním trhu a pomůže tlumit prudký růst tržního nájemného v celém městě. Zranitelným obyvatelům a lidem v krizových situacích tak město zaručí spolehlivou záchrannou síť, která zabrání propadu na ubytovny a umožní jim dlouhodobě důstojný život. Vzhledem k nedostatku bezbariérového a dostupného bydlení, kvůli němuž mnoho seniorů zůstává „uvězněno“ ve svých bytech bez výtahu, může zastupitelstvo schválit systematický plán rekonstrukcí obecního fondu na bezbariérové byty a podpořit výstavbu mezigeneračních komunitních domů, což zabrání sociální izolaci starších lidí a umožní jim žít důstojně.
  category: Bydlení a sociální politika
  answers:
  - party: matous_pelikan
    answer: ano
    comment: Dostupné bydlení je jednou z našich priorit. Město má svůj bytový fond
      nejen udržovat, ale tam, kde je to ekonomicky rozumné, také systematicky rozšiřovat
      a vytvářet více dostupných a bezbariérových bytů. Nechceme ale spoléhat pouze
      na novou městskou výstavbu. Prosazujeme také vznik městské nájemní agentury,
      která zapojí do systému dostupného bydlení soukromé byty a jejich vlastníkům
      nabídne garantované nájemné. Potřebujeme kombinovat více nástrojů tak, aby město
      dokázalo pomoci mladým rodinám, seniorům i lidem v obtížné životní situaci.
  - party: josef_kastil
    answer: ne
    comment: 'NE plošně! Městské byty mají podle mě smysl především tam, kde má město
      důvod konkrétním lidem s bydlením pomoci, například seniorům, lidem se zdravotním
      postižením nebo lidem v obtížné životní situaci. V těchto případech je naopak
      důležité, aby město potřebnými byty disponovalo.


      Nechci ale, aby se město stalo developerem a za miliardy z veřejných peněz budovalo
      rozsáhlý bytový fond. Dostupnější bydlení pro většinu lidí vznikne především
      tehdy, když bude v Olomouci dostatek nových bytů. Město proto musí především
      urychlit přípravu a povolování výstavby, využívat brownfieldy a vytvářet předvídatelné
      podmínky pro soukromé investory. To je podle mě efektivnější cesta k dostupnějšímu
      bydlení než masivní výkup a výstavba městských bytů.'
