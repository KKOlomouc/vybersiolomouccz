      fungují již dnes a chceme je dále podporovat a rozvíjet. Smysl vidíme především
      v podpoře místních spolků, knihoven, komunitních prostor a dalších míst, která
      již dnes slouží k setkávání obyvatel. Tam, kde takové zázemí skutečně chybí,
      jsme otevřeni i vzniku nového komunitního centra. Nemusí přitom vždy jít o novou
