- id: question-14
  index: 14
  thesis: Souhlasíte s tím, aby při sestavování městského rozpočtu bylo upřednostňováno financování soukromých investičních projektů před veřejnými službami (např. školství, kultura, zdravotnictví, sociální služby a také opravy, údržba, úklid města apod.)?
  thesisContext: |
    Zadlužení statutárního města Olomouce činilo na konci minulého roku 1,61 miliardy korun, což z něj dlouhodobě dělá nejzadluženější město v Olomouckém kraji a jedno z nejzatíženějších velkých měst v ČR. V přímém porovnání s nejlépe hospodařícími statutárními městy v ČR, nedaleký Prostějov dlouhodobě nemá žádné dluhy a své investice dokáže financovat ze svého rozpočtu a finančních rezerv. Naproti tomu finanční kondice města Olomouce má sestupný trend směrem k většímu zadlužování a zaostává v mnoha oblastech. Další investice do soukromých projektů proto neúměrně zatíží olomoucký rozpočet na úkor běžného provozu města (opravy, údržba, úklid) a poskytování veřejných služeb (např. v oblasti školství, kultury, zdravotnictví, sociálních služeb, bezpečnosti apod.). Příkladem špatné praxe z minulosti je výrazné zadlužení výstavbou a následným financováním Aquaparku Olomouc. Tento projekt byl realizován formou partnerství veřejného a soukromého sektoru (tzv. PPP projekt), který se pro město ukázal jako dlouhodobě nevýhodný. Výstavba aquaparku schválená v roce 2007 a dokončená v roce 2009 stála zhruba 497 milionů Kč. Na stavbu byl využit úvěr ve výši 335 milionů Kč. Město muselo každoročně soukromému partnerovi vyplácet takzvané služebné (splátku za úvěr a provoz). Tato částka původně činila necelých 30 milionů Kč ročně, později však kvůli ztrátovosti aquaparku a finančním potížím narostla až na 45 milionů Kč ročně. Vzhledem k nevýhodnosti smluv se město Olomouc rozhodlo postupně odkoupit podíly od soukromých firem (Atzwanger, Gemo a Skanska), aby získalo nad areálem plnou kontrolu. V roce 2017 se Olomouc stala stoprocentním vlastníkem, přičemž za samotný odkup akcií zaplatila celkem přes 200 milionů Kč. Spolu se schodkovým provozem a investicemi stála tato atrakce město celkově více než miliardu korun (téměř 2/3 současného dluhu).    
