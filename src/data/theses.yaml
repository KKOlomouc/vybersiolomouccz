- id: question-15
  index: 15
  thesis: Souhlasíte se systémovou pomocí lidem bez domova? Může jít například o zapojení městských bytů (v případě, že by jimi město disponovalo) do programu Housing First, zavedení chráněných pracovních míst (např. u TSMO s denní výplatou) nebo navýšení financí pro terénní a zdravotní péči.
  thesisContext: |
    Získání stabilního bytu v rámci Housing First odstraní každodenní boj o přežití a vytvoří bezpečné zázemí nutné pro řešení dluhů, závislostí či psychických potíží. Trvalá adresa a sociální doprovod lidem navíc umožní vyřídit ztracené doklady, čerpat sociální dávky a hledat dlouhodobé zaměstnání. 
    Drobné práce u technických služeb s denní výplatou zajistí okamžitý legální příjem, posílí sebeúctu a nahradí potřebu žebrání. 
    Dostupná terénní a zdravotní péče léčí zanedbaná onemocnění bez předsudků včas a předchází úmrtím na podchlazení během zimy. Tato provázaná opatření společně vytvářejí funkční systém, který lidi posouvá od pouhého přežívání k trvalému návratu do běžné společnosti.  
  category: Bydlení a sociální politika
  answers:
  - party: matous_pelikan
    answer: ano
    comment: Lidé bez domova potřebují systémovou pomoc, která propojí sociální a
      terénní práci, dostupné bydlení, zdravotní péči a možnost návratu k zaměstnání.
      Podporujeme využívání nástrojů, které prokazatelně pomáhají lidem vrátit se
      k běžnému životu, včetně vhodných forem podporovaného bydlení a pracovních programů.
      Současně ale musí město důsledně dbát na bezpečnost, čistotu a dodržování pravidel
      ve veřejném prostoru. Sociální pomoc a udržování veřejného pořádku se nevylučují
      – město musí zvládat obojí.
  - party: josef_kastil
    answer: ano
    comment: 'ANO. Lidem bez domova je potřeba nabídnout systémovou pomoc, která jim
      umožní vrátit se k běžnému životu, nikoliv pouze řešit jejich situaci krátkodobě.
      Podporuji proto využití městských bytů pro programy typu Housing First, pokud
      budou doprovázeny odpovídající sociální a terénní podporou.


