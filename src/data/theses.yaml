  thesis: |
    Souhlasíte s rozšířením Energetického společenství Olomouc (ESO) tak, aby se do něj mohly zapojit také místní firmy, neziskové organizace nebo domácnosti, které chtějí sdílet nebo odebírat energii z obnovitelných zdrojů?
  thesisContext: |
    Energetické společenství umožňuje lidem, firmám nebo organizacím sdílet mezi sebou elektřinu, například z místních solárních elektráren. Otázka se týká toho, zda se má tato možnost v Olomouci otevřít širšímu okruhu místních odběratelů.  
  category: Klima a energetika
  answers:
  - party: matous_pelikan
    answer: ano
    comment: Energetické společenství považujeme za smysluplný projekt a podporujeme
      jeho další rozvoj. Pokud to bude technicky a ekonomicky výhodné, mělo by se
      postupně otevřít také místním firmám, neziskovým organizacím a domácnostem.
      Smyslem komunitní energetiky má být především efektivní využití energie vyrobené
      přímo v Olomouci, nižší náklady a větší energetická soběstačnost města.
