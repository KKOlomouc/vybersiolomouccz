- id: question-0
  index: 0
  thesis: |
    Chcete v městské hromadné dopravě alespoň dvě z následujících opatření? 
    a) Bezplatné jízdné pro žactvo a studentstvo ZŠ a SŠ s trvalým pobytem v Olomouci.
    b) Levnější krátkodobou jízdenku (např. 15 minut za 15 Kč).
    c) Zvýšení frekvence denních i nočních spojů
  thesisContext: |
    ad a) Mnoho krajských měst v Česku má jízdné pro žáky zcela zdarma nebo téměř zdarma. Je to nejen motivace k tomu, aby žáci využívali MHD, ale také přesně zacílená sociální podpora ze strany města na konkrétní účel. Pro mnohé domácnosti představuje současná výše jízdného zásadní výdaj.
    ad b) Téměř všechna krajská města v Česku nabízí nejen standardní jízdenku, ale i levnější na kratší jízdu. Cena 25 Kč například za 3 zastávky neodpovídá poskytnuté službě.
    ad c) Zvláště okrajové části města mají zhoršenou dostupnost městskou hromadnou dopravou. Často se jedná i o hodinové intervaly během dne a samozřejmě večer. Taková forma dopravní obsluhy není atraktivní a nemůže konkurovat automobilové dopravě.
  category: Doprava a veřejná infrastruktura
  answers:
  - party: matous_pelikan
    answer: ano
    comment: ANO, ad. b), levnější krátkodobou jízdenku, jízdenku "na skok" máme ve
      volebním programu (např. 15 minut za 15 Kč).
  - party: josef_kastil
    answer: ano
    comment: Podporuji především levnější krátkodobou jízdenku, například 3 zastávky
      za 10 Kč. Jsem také pro zvýšení frekvence spojů tam, kde analýza přepravních
      potřeb ukáže, že jsou skutečně potřeba, nechci ale platit za spoje, které budou
      vozit vzduch. U žáků a studentů bych místo úplně bezplatné dopravy preferoval
      výraznou slevu nebo propojení celoročního jízdného s dalšími benefity, například
      vstupy na bazén či aquapark nebo podporou pohybových aktivit dětí.
  - party: otakar_bacak
    answer: ano
    comment: ''
  - party: ales_prstek
    answer: ne
    comment: Navrhujeme MHD zdarma pro přesuny žáků na školní akce.
  - party: miroslav_janosek
    answer: ano
    comment: ''
  - party: lucie_tungul
    answer: ne
    comment: ''
  - party: roman_koutek
    answer: ano
    comment: Možnost vybrat si z různé délky časové jízdenky je dobrý krok , úprava
      frekvence využití jednotlivých spojů je samozřejmost
  - party: robert_runtak
    answer: nevim
    comment: ''
  - party: zdenek_cernohouz
    answer: nevim
    comment: Levnější jízdenka je k úvaze. Místo plné dotace žákům a studentů postačí
      výrazně zlevněná časová jízdenka. Přijde mi nezodpovědné navýšení frekvence
      slibovat obecně bez dat a konkrétních lokalit. Někde určitě ano (např. Kopeček).
  - party: kristina_machacikova
    answer: ano
    comment: "Věřím, že dopravním problémům může pomoci MHD zdarma pro děti. Mnozí\
      \ rodiče by potom zvážili využití automobilu. Čím více lidí bude využívat MHD,\
      \ kola, chůze, tím plynulejší bude i doprava všeobecně ve městě. \nJedním z\
      \ mnoha problémů jsou chybějící spoje po 23h. Kdyby noční spoje jezdily alespoň\
      \ do půlnoci, pomohlo by to sociálnímu a kulturnímu životu."
  - party: zdenek_zak
    answer: ano
    comment: ''
  - party: jakub_jurka
    answer: ano
    comment: ''
  - party: rostislav_hainc
    answer: ano
    comment: Určitě by se v Olomouci hodila krátkodobá levná jízdena např. na 3 zastávky.
      Co se týká dotování jízdenek pro žáky a studenty zcela zdarma není v Olomouci
      úplně na místě, protože peníze z jízdenek se mohou adekvátně využít na modernizaci
      či rozvoj DPMO a třeba i zvýšením intervalů.
  - party: vaclav_huttel
    answer: ano
    comment: 'Ano ke všem třem. Pro kontext: v současné době vyplatí rodina se dvěma
      dětmi ve věku kdy ještě potřebují doprovod zhruba 20,000kč ročně jenom za cestu
      do školy a zpátky. Dostupnější MHD je prospěšná ekonomicky, ekologicky a sociálně.'
  - party: antonin_kropacek
    answer: ano
    comment: Dle mého názoru je vhodné motivovat občany i návštěvníky města k většímu
      využívání MHD
  - party: robert_pokorny
    answer: ano
    comment: ''
  - party: marek_zelenka
    answer: ano
    comment: Ano, plánujeme a) a c). Namísto zlevnění jednorázových lístků chceme
      zjednodušit a zlevnit prodej měsíčních kuponů, aby byly maximálně dostupné a
      atraktivní pro co nejširší skupiny obyvatel.
  - party: michal_langer
    answer: nevim
    comment: Chceme posílení MHD během špičky, spolehlivé noční spoje do všech částí
      a MHD zdarma v době velkých akcí. Levnější krátkodobou jízdenku přímo v programu
      neřešíme, ale umím si představit, že by šlo o řešení, které by mohlo některé
      lidi motivovat k využití MHD, je ale potřeba udělat takové rozhodnutí na základě
      dat a vést k němu diskusi, jelikož už teď je provoz MHD mnohonásobně nákladnější,
      než kolik pokryjí peníze za vybrané jízdné a městská kasa není bezedná.
  - party: pavel_grasse
    answer: ano
    comment: budu prosazovat ad b) a ad c)
- id: question-1
  index: 1
  thesis: |
    Chcete, aby byla zrušena naplánovaná nová parkovací zóna C (širší centrum města mimo sídliště) v následujícím režimu: rezident za první automobil platí 600 Kč ročně, za druhý už několik tisíc; dojíždějící bude platit 20 Kč/hod, kdy 1 hodina denně je zdarma?
  thesisContext: |
    V širším centru města Olomouce je parkování zdarma. V pracovní dny jsou kolem placené zóny (a mnohdy dál) zcela obsazená parkovací místa dojíždějícími. Pokud je parkování zcela zdarma, může to vést k nehospodárnému využívání prostoru. Mnoho automobilů je využíváno méně často, některá by mohla být odstavena na soukromém pozemku vlastníků apod. Zpoplatněním parkování je cenný veřejný prostor využíván více efektivně. Město na opravy a údržbu místních komunikací nezískává ze státního rozpočtu žádné zvláštní peníze. Přes 40 % domácností v Olomouci nevlastní automobil. I tyto domácnosti doplácejí na parkování těch, kteří automobil vlastní. Platba rezidentního parkování v řádu stokorun ročně tak přispívá k férovějšímu hospodaření s veřejnými penězi. Rezidenti jsou zvýhodněni před dojíždějícími, kteří musí platit mnohem vyšší cenu za krátkodobé parkování.  
  category: Doprava a veřejná infrastruktura
  answers:
  - party: matous_pelikan
    answer: ne
    comment: Zóny placeného parkování nemají být cílem, ale jedním z nástrojů řešení
      statické dopravy. Jejich zavádění proto musí doprovázet další opatření – zejména
      P+R parkoviště s návazností na MHD, kvalitní veřejná doprava a provázaná síť
      cyklostezek. Systém zároveň musí být administrativně jednoduchý, přívětivý k
      rezidentům a srozumitelně komunikovaný. Bez nabídky skutečných alternativ by
      se z placených zón stal jen další způsob, jak z lidí vybírat peníze.
  - party: josef_kastil
    answer: ano
    comment: ANO, ale parkovací politiku chci změnit mnohem komplexněji. Nechci zpoplatňovat
      parkování jako další městskou daň, první rezidentní karta má být zdarma. Zároveň
      chci vybudovat dostatek parkovacích míst a především záchytná parkoviště P+R
      na okrajích města a dobře je propojit s MHD. Cílem je nabídnout mimoolomouckým
      možnost nechat auto na okraji města a pohodlně pokračovat tramvají či autobusem,
      nikoli je pouze vytlačit do okolních ulic. Parkovací politika musí být součástí
      fungujícího dopravního systému, ne jen nástrojem k vybírání poplatků.
  - party: otakar_bacak
    answer: ne
    comment: ''
  - party: ales_prstek
    answer: ne
    comment: Plánujeme zavedení rezidenčního parkování postupně v celé zóně C z důvodu
      zvýhodnění rezidentů.
  - party: miroslav_janosek
    answer: ne
    comment: ''
  - party: lucie_tungul
    answer: ne
    comment: Je nutné zavést komplexní parkovací politiku, současný stav je neudržitelný.
      Zpoplatnění zóny B a A vede k tomu, že zejména na hraničních ulicích v zóně
      C parkují nerezidenti a rezidenti nemají kde parkovat, Zpoplatnění jen zóny
      C ale problém zase jen posouvá dále. Podporujeme rezidenční parkování, ale v
      rámci komplexní politiky, která navíc dává rezidentům časovou dotaci pro návštěvy,
      která zlepšuje parkovací kapacity a buduje odstavná parkoviště. Pouze zpoplatnění
      zón a zvyšování plateb za parkování je špatnou parkovací politikou.
  - party: roman_koutek
    answer: ne
    comment: Zvýhodněné rezidenční parkování je správná cesta. Výše parkovného a parametry
      lze upravit dle zkušeností z provozu .
  - party: robert_runtak
    answer: ne
    comment: ''
  - party: zdenek_cernohouz
    answer: ne
    comment: Když už máme zóny A a B, není možné nechat trpět jen lidi v zóně C. Nicméně
      parkovací politika musí být digitalizovaná, přívětivá (vč. prvního auta v rodině
      zdarma) a hlavně funkční. Opatření musí být víc vč. nových parkovacích stání.
  - party: kristina_machacikova
    answer: ne
    comment: ''
  - party: zdenek_zak
    answer: ne
    comment: ''
  - party: jakub_jurka
    answer: ano
    comment: ''
  - party: rostislav_hainc
    answer: ne
    comment: Určitě se musí parkovací politiky dokončit a doladit, protože tím, že
      se zavede parkování placené se nezvýší počet parkovacích míst. Proto je nutné,
      pokud chcete, aby občané platili za své automobily musíte jim nabídnout také
      vhodné parkovací stání. Aby nedocházelo k tomu, že si lidé zaplatí a stejně
      své parkovací místo blízko domu nenajdou. Město musí rozšířit parkovací stání
      a také P+R.
  - party: vaclav_huttel
    answer: ne
    comment: 'Zpoplatnění parkování druhého auta rezidentů by se mělo pohybovat v
      řádech desetitisíců

      ročně. Parkování v centru bychom řešili raději absolutní preferencí MHD a cyklistů.'
  - party: antonin_kropacek
    answer: ano
    comment: Parkování (statická doprava) je zcela běžnou součástí silniční dopravy.
      Výběr „parkovného“ (ve skutečnosti poplatku bez poskytnutí služby) není slušné.
      Sebevyšší poplatek nevytvoří nová parkovací místa. Sebevyšší poplatek nezajistí
      vznik parkovacího místa. Aby byla zajištěna možnost zaparkování musel by být
      počet parkovacích karet roven počtu parkovacích míst v dané lokalitě
  - party: robert_pokorny
    answer: ano
    comment: Parkování v centru bychom řešili raději absolutní preferencí MHD, razantním
      zlevněním jízdného a podporou cyklodopravy.
  - party: marek_zelenka
    answer: ne
    comment: Zóna C, jak je naplánovaná, je naplánovaná z našeho pohledu dobře a chceme
      ji prosadit. Po roce od zavedení ji vyhodnotíme a případně přizpůsobíme. Naopak
      zónu D (sídliště) bychom zaváděli až po vyhodnocení zkušeností se zónou C.
  - party: michal_langer
    answer: ne
    comment: Reformu rezidentního parkování považujeme za nutnou a podporujeme ji.
      První auto rezidenta by mělo parkovat ve své čtvrti za nižší poplatek; dlouhodobé
      stání aut z jiných regionů na sídlištích zpoplatníme a zregulujeme.
  - party: pavel_grasse
    answer: ne
    comment: Můj názor je zavést parkovací politiku na celé území města, byť s místními
      specifiky, a to i vytvořením zón, které budou mít nyní nulový poplatek, ale
      budou součástí sběru dat o parkování rezidentů a návštěvníků na celém území
      města ve veřejných prostranstvích. Důvodem je možnost nastavování opatření zamezujících
      přelivu parkujících na hranicích placených a neplacených zón. Názor vychází
      z obavy občanů v částech města, kde nejsou plánovány parkovací zóny. Obávají
      se toho, že po zavedení cílové parkovací politiky se do jejich částí města přesunou
      automobily ze zpoplatněných zón. Komplexní systém sledování bude vytvářet data
      potřebná k rychlému přenastavování nebo doplňování systému parkování ve veřejných
      prostranstvích.
- id: question-2
  index: 2
  thesis: |
    Chcete, aby se investovalo alespoň 500 mil. Kč do výstavby souvislé sítě cyklostezek ve městě i za cenu, že nevzniknou 2 parkovací domy?
  thesisContext: |
    Infrastruktura pro cyklisty začne pořádně fungovat až tehdy, pokud je souvislá bez přerušovaných úseků. Často je potřeba větších investic pro přetvoření celého uličního prostoru, včetně přeložek inženýrských sítí, výsadby stromů apod. Olomouc stále ani zdaleka nemá souvislou hlavní síť infrastruktury pro cyklisty. Plánuje však za stovky milionů Kč parkovací domy pro relativně málo automobilů. Za stejnou cenu lze vybudovat komfortní infrastrukturu pro cyklisty na všech důležitých trasách ve městě.
  category: Doprava a veřejná infrastruktura
  answers:
  - party: matous_pelikan
    answer: ne
    comment: Naším cílem není jednorázově utratit půl miliardy korun, ale systematicky
      každý rok budovat další úseky tak, aby postupně vznikla skutečně souvislá síť.
  - party: josef_kastil
    answer: ne
    comment: NE. Jsem dlouhodobě velkým zastáncem cyklodopravy a chci, aby Olomouc
      měla bezpečnou a skutečně souvislou síť cyklostezek. Nesouhlasím ale s tím,
      abychom předem stanovili částku 500 milionů Kč a zároveň kvůli ní automaticky
      obětovali dva parkovací domy. O investicích by měl rozhodovat konkrétní přínos
      pro dopravu, připravenost projektů a možnost získat dotace. Chci rozvíjet cyklodopravu,
      ale zároveň řešit parkování a MHD jako jeden propojený dopravní systém.
  - party: otakar_bacak
    answer: nevim
    comment: ''
  - party: ales_prstek
    answer: nevim
    comment: ''
  - party: miroslav_janosek
    answer: ne
    comment: ''
  - party: lucie_tungul
    answer: ne
    comment: otázku nelze stavět bud, anebo a stavět proti sobě auta a kola. Olomouc
      musí zlepšit síť cyklostezek a plně fo podporujeme, nicméně také musí řešit
      parkování a pokud to nemá být na úkor zeleně, což nechceme, tak je třeba stavět
      i parkovací domy.
  - party: roman_koutek
    answer: nevim
    comment: Jednotlivé druhy dopravy se musí doplňovat , ne soupeřit mezi sebou.
  - party: robert_runtak
    answer: ne
    comment: ''
  - party: zdenek_cernohouz
    answer: ne
    comment: V otázce píšete o cyklostezkách a v kontextu o infrastruktuře obecně.
      Třeba místa pro parkování kol na exponovaných místech a dopracování sítě potřeba
      rozhodně jsou. Na druhé  straně jsou tu i jiné formy dopravy a není možné se
      zaměřit jen na jednu. Z otázky se to jeví tak, že by mělo 500 mil. Kč z městského,
      ale hradí se větší část z dotací. Když to spočteme, byly by to miliardy korun
      a nespecifikujete dobu, za kterou by se to utratilo.
  - party: kristina_machacikova
    answer: ano
    comment: Bezpečný pohyb na kole po městě by měl být základ. Mnohé občany může
      odrazovat od jízdy na kole špatná cyklo-infrastruktura.
  - party: zdenek_zak
    answer: nevim
    comment: ''
  - party: jakub_jurka
    answer: nevim
    comment: ''
  - party: rostislav_hainc
    answer: ano
    comment: Potřebná jsou parkoviště P+R na okrajích města. Cyklistické trasy chybí
      např. Droždín - Bystrovany - Samotíšky, Chomoutov - Olomouc, Holice - Nové Sady
      a další...
  - party: vaclav_huttel
    answer: ano
    comment: Otázka je nevhodně položená. Jsme jednoznačně pro podporu cyklodopravy
      v Olomouci. Otázkou je, zda je nutné přetvářet celé uliční prostory a následně
      musí cena protáhnout do přinejmenším půl miliardy.
  - party: antonin_kropacek
    answer: nevim
    comment: Otázka je nevhodně položena, obě investice (cyklostezka i parkovací domy)
      jsou pro město potřebné
  - party: robert_pokorny
    answer: ano
    comment: Jsme jednoznačně pro podporu cyklodopravy v Olomouci. Otázkou je, zda
      musí být k tomuto účelu přetvářeny celé uliční prostory, aby konečná cena šplhala
      do astronomických částek. Otázka navíc nesmyslně přispívá k dalšímu polarizování
      Olomoučanů.
  - party: marek_zelenka
    answer: ano
    comment: Plánované parkovací domy u Flory a v Hodolanech podle nás nejsou na vhodných
      místech a nebudou plnit svůj avizovaný účel. Tyto peníze bychom přesměrovali
      na jíné účely v souladu se statutem Fondu mobility, tzn. mimo jiné právě na
      cyklostezky.
  - party: michal_langer
    answer: nevim
    comment: Myslím si, že budování cyklostezek a parkovacích domů se navzájem nevylučuje.
      Chceme stavebně oddělené pruhy na hlavních tepnách, propojení fragmentovaných
      cyklostezek, odstranění nebezpečných míst a krytá uzamykatelná parkoviště pro
      kola.
  - party: pavel_grasse
    answer: ano
    comment: I když parkování automobilů v intenzivnějších formách (parkovací domy)
      považuji za neodkladný a důležitý trend dopravy v klidu, který řeší současně
      mimo jiné i uvolňování ploch pro zeleň a eliminaci tepelných ostrovů, potřeba
      investic do cyklistické infrastruktury je v Olomouci také neodkladná. Kromě
      potřeby propojení již stávajících úseků cyklotras a cyklostezek považuji za
      velmi důležitou i změnu kurzu plánování cyklodopravy ve prospěch oddělených
      cyklostezek. Olomouc hodně vsadila na cyklopruhy a to i na velmi zatížených
      sběrných komunikacích, kde se oprávněně cyklisté cítí ohroženi. Paradoxně se
      ale cítí stejně ohroženi i automobilisté.  Výsledkem pode mého nedobré cyklopolitiky
      je, že cyklisté potom raději jezdí po chodnících, čímž zase ohrožují chodce,
      obzvláště ty již méně pohyblivé.
- id: question-3
  index: 3
  thesis: |
    Chcete alespoň dvě z následujících opatření pro komfortní život ve veřejném prostoru, abyste mohli trávit více času venku?
    a) Zřízení nových veřejných WC s přístupem k pitné vodě zdarma.
    b) Zachování stávajících laviček ve městě a vybudování nových tam, kde nyní žádné nejsou a zároveň jejich umístění nic nebrání (např. v parcích).
    c) Zřízení opatření pro usnadnění pěšího pohybu ve městě i pro lidi se specifickými potřebami (rodiče s kočárky, senioři, osoby s TP, ZTP atp.).
  thesisContext: |
    ad a) Příkladem dobré praxe může být Francie, kde ve městech i na vesnicích fungují věřejná WC zdrama. ""Právo na přístup k toaletám je součástí lidského práva na hygienu. Je součástí práva na bezpečnou pitnou vodu. ... V sázce je také inkluzivnost veřejných prostor. Některé kategorie populace jsou náchylnější k naléhavým potřebám: senioři, mladší lidé, těhotné ženy, lidé s nemocemi nebo poruchami doprovázenými inkontinencí… Absence bezplatných veřejných toalet tak zbavuje část populace práva na volný pohyb, zejména při cestách dále od domova. ... Veřejné toalety, kromě toho, že musí být přístupné a bezplatné, musí být také viditelné a instalované na strategických trasách po celém městě."" (https://www.francioli-citygie.com/fr/blog/la-gratuite-des-toilettes-publiques-en-france-etat-des-lieux)
    Je důstojné i hygienické, když lidé mohou vykonat potřebu na veřeném WC zdrama, než aby museli vybírat mezi zaplacením 10-20 Kč nebo znečištěním veřejného prostoru. Chce-li radnice zachovat město čisté a zároveň podporovat zdraví věřejnosti, udělá službu lidem tím, že budou moci trávit více času venku, bez obav, kde vykonají potřebu.
    ad b) Radnice v minulosti odstraňovala lavičky z toho důvodu, že je využívali také lidé bez domova. To však problém neřeší. Lidí bez domova tímto krokem neubude, navíc obsadí jiné lavičky v jiné lokalitě. Lavičky jsou důležité pro starší lidi, kteří při pohybu pěšky městem potřebují odpočinek. Jsou ale také důležité pro zútulnění a socializaci města, pro vytváření příležitostí pro pobyt venku. Problémy s lidmi, kteří narušují veřejný pořádek je potřeba řešit spíše důslednou sociální prací, ne rušením laviček.
    ad c) Většina lidí má během svého života dočasné nebo travalé omezení pro pěší pohyb ve městě. Při pohybu s kočárkem, při dočasném zranění, při trvalém fyzickém hendikepu nebo ve stáří. Fyzické bariéry omezují nebo dokonce znemožnují některým lidem pohyb po městě. Komfort chůze ale také ztěžují semafory s příliš dlouhou čekací dobou, nerovná dlažba, dlouhé obchozí trasy, příliš úzké chodníky apod. Je prokázáno, že lidé častěji chodí pěšky, když jsou k tomu ideální podmínky.
  category: Doprava a veřejná infrastruktura
