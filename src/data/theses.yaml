    Kulturní nabídka Olomouce se soustřeďuje především do centra. Strategie rozvoje kultury a kreativního průmyslu města Olomouce upozorňuje, že v některých hustě obydlených částech chybějí prostory pro kulturní akce (koncerty, divadlo), setkávání obyvatel a sousedské aktivity. Kulturně-komunitní centrum může zahrnovat menší sál, klubovny, knihovnu nebo prostory využitelné místními spolky a obyvateli.
