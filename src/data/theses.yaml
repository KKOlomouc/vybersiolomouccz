- id: question-11
  index: 11
  thesis: Je pro vás důležité rozšíření možností amatérského sportování formou výstavby nových sportovišť a zlepšení přístupu ke stávajícím městským a školním sportovištím ve všech městských částech?
  thesisContext: |
    Strategický plán města upozorňuje na nerovnoměrné rozmístění sportovišť, jejich zastaralost a nedostatek dostupných venkovních ploch. Rozšíření přístupu by mohlo znamenat výstavbu nových hřišť, rekonstrukci stávajících sportovišť nebo otevření školních areálů; město by přitom muselo zajistit jejich správu, údržbu a bezpečnost.  
  category: Neprofesionální sport
  answers:
  - party: matous_pelikan
    answer: ano
    comment: Sportoviště mají být dostupná lidem ve všech částech Olomouce. Chceme
      postupně budovat a obnovovat venkovní hřiště a další sportovní plochy a současně
      lépe využívat to, co už město má. Velký potenciál vidíme například ve zpřístupňování
      školních sportovišť veřejnosti mimo dobu výuky, samozřejmě při zajištění jejich
      správy a bezpečnosti. Podpora dostupného amatérského sportu, zejména u dětí
      a mladých lidí, je podle nás jednou ze základních úloh města.
  - party: josef_kastil
    answer: ano
    comment: ANO! Podporuji rozvoj amatérského sportu a dostupných sportovišť ve všech
      městských částech. Nejde přitom jen o výstavbu nových areálů, ale také o lepší
