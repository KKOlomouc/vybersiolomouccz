# .forgejo/workflows/pages.yml
name: Publish
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      # Use your favourite site generator here. Anything that writes the
      # finished site into a directory will do.
      - run: corepack enable && pnpm install && pnpm build

      - uses: actions/git-pages@v2
        with:
          site: https://${{ forgejo.event.repository.owner.username }}.codefloe.page/${{ forgejo.event.repository.name }}/
          server: codefloe.page
          token: ${{ forgejo.token }}
          source: dist/
